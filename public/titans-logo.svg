<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <filter id="titansGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="50%" stop-color="#E51D24" />
      <stop offset="100%" stop-color="#B80D13" />
    </linearGradient>
  </defs>
  <rect width="900" height="800" fill="#000000" rx="12"/>

  <!-- SPARTAN HELMET SYMBOL -->
  <g transform="translate(450, 270)" stroke="#E51D24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Crest Sweep (back curve) -->
    <path d="M 40 -185 C 130 -180 200 -120 220 -40 C 235 25 220 80 185 130 C 145 190 70 230 -20 240 C -120 240 -200 150 -210 100 C -225 30 -210 -50 -180 -110 C -140 -170 -60 -210 30 -215 C 110 -220 180 -180 220 -110 C 240 -70 245 -20 235 40" stroke-width="0" fill="none"/>
    
    <!-- Spartan Helmet Main Plume / Crest Outer Contour -->
    <path d="M 60 -195 C 150 -180 215 -110 225 -30 C 235 45 200 120 160 165 C 140 190 115 210 85 225" stroke="#E51D24" stroke-width="14"/>
    
    <!-- Crest Base / Helmet Crown -->
    <path d="M -180 60 C -190 10 -170 -60 -125 -125 C -75 -190 10 -215 90 -210 C 175 -205 230 -140 240 -50 C 248 20 220 95 170 150 C 135 190 90 220 35 235" stroke="#E51D24" stroke-width="13"/>
    
    <!-- Helmet Brow, Nose Bridge & Cheek Guard -->
    <path d="M 170 -50 C 150 -55 120 -50 90 -35 C 55 -20 25 5 5 45 C -5 60 -10 80 -12 110 C -15 145 5 180 35 215" stroke="#E51D24" stroke-width="12"/>
    
    <!-- Sharp Eye Visor & Cheek Bone Cutout -->
    <path d="M 90 -35 L 145 25 C 150 30 148 40 140 45 L 85 65 C 70 70 58 85 55 105 L 50 155" stroke="#E51D24" stroke-width="12"/>

    <!-- T-Slit / Face Opening Negative Space Contour -->
    <path d="M 125 15 L 155 70 C 160 80 155 92 145 98 L 95 120 C 80 128 70 145 70 165 L 75 195" stroke="#E51D24" stroke-width="10"/>

    <!-- Dynamic Plume Inner Feather/Flame Silhouette -->
    <path d="M -50 -140 C -10 -145 35 -130 65 -95 C 90 -65 95 -20 85 30 C 70 90 30 140 -25 175 C -75 160 -105 110 -110 60 C -115 5 -95 -50 -70 -95 Z" fill="#E51D24" stroke="#E51D24" stroke-width="4"/>

    <!-- Rear Neck Guard Flare -->
    <path d="M -180 60 C -170 100 -140 140 -90 170" stroke="#E51D24" stroke-width="12"/>
    <path d="M -195 20 C -205 60 -195 105 -165 145 C -145 170 -115 190 -80 205" stroke="#E51D24" stroke-width="8"/>
  </g>

  <!-- BARBELL LEFT -->
  <g fill="#E51D24">
    <!-- Plate 1 (small outer) -->
    <rect x="50" y="585" width="22" height="60" rx="11" />
    <!-- Plate 2 (middle) -->
    <rect x="80" y="565" width="26" height="100" rx="13" />
    <!-- Plate 3 (tall inner) -->
    <rect x="115" y="540" width="32" height="150" rx="16" />
    <!-- Bar Collar Left -->
    <rect x="147" y="605" width="25" height="20" rx="3" />
  </g>

  <!-- BARBELL RIGHT -->
  <g fill="#E51D24">
    <!-- Bar Collar Right -->
    <rect x="728" y="605" width="25" height="20" rx="3" />
    <!-- Plate 3 (tall inner) -->
    <rect x="753" y="540" width="32" height="150" rx="16" />
    <!-- Plate 2 (middle) -->
    <rect x="794" y="565" width="26" height="100" rx="13" />
    <!-- Plate 1 (small outer) -->
    <rect x="828" y="585" width="22" height="60" rx="11" />
  </g>

  <!-- CONNECTING BARBELL HORIZONTAL BAR WITH NOTCHES -->
  <rect x="170" y="610" width="560" height="10" rx="3" fill="#E51D24"/>
  <!-- Central thickened bar section under TITANS GYM -->
  <rect x="180" y="605" width="540" height="20" rx="4" fill="#E51D24"/>

  <!-- TYPOGRAPHY: TITANS GYM -->
  <text x="450" y="585" text-anchor="middle" font-family="'Orbitron', 'Eurostile', 'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="58" letter-spacing="6" fill="#E51D24">
    TITANS GYM
  </text>

  <!-- SUBTITLE WITH FLOURISH LINES: Fight for Fitness -->
  <g>
    <!-- Left flourish line & leaf -->
    <path d="M 215 658 C 205 668 195 678 185 680 C 185 670 195 660 205 658 Z" fill="#E51D24" />
    <line x1="205" y1="658" x2="315" y2="658" stroke="#E51D24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Italic Script: Fight for Fitness -->
    <text x="450" y="665" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Cinzel', serif" font-style="italic" font-weight="700" font-size="28" letter-spacing="1" fill="#E51D24">
      Fight for Fitness
    </text>

    <!-- Right flourish line & leaf -->
    <line x1="585" y1="658" x2="695" y2="658" stroke="#E51D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 695 658 C 705 660 715 670 715 680 C 705 678 695 668 685 658 Z" fill="#E51D24" />
  </g>

  <!-- SUBTITLE: UNISEX FITNESS ARENA -->
  <text x="450" y="720" text-anchor="middle" font-family="'Orbitron', 'Montserrat', 'Inter', sans-serif" font-weight="800" font-size="30" letter-spacing="7" fill="#FFFFFF">
    UNISEX FITNESS ARENA
  </text>
</svg>
